<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | VetSalud</title>

    <link rel="stylesheet" href="css/estiloslogin.css">

</head>

<body>

    <div class="contenedor">

        <div class="login">

            <!-- LOGO -->

            <div class="logo">

                <img src="img/logo.jpeg" alt="Logo VetSalud">

                <h1>VetSalud</h1>

            </div>


            <!-- TÍTULO -->

            <h2>Bienvenido de nuevo</h2>

            <p class="texto">
                Inicia sesión para gestionar tus citas
                y las de tu mascota.
            </p>


            <!-- FORMULARIO -->

            <form>

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresa tu correo"
                    required
                >


                <label for="contrasena">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >


                <div class="opciones">

                    <label class="recordar">

                        <input
                            type="checkbox"
                            id="recordar"
                        >

                        Recordarme

                    </label>


                    <a href="contraseña.html">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <!-- REGISTRO -->

            <p class="registro">

                ¿No tienes una cuenta?

                <a href="registro.html">
                    Regístrate
                </a>

            </p>


            <!-- VOLVER -->

            <a href="index.html" class="volver">
                ← Volver al inicio
            </a>

        </div>


        <!-- PARTE DECORATIVA -->

        <div class="decoracion">

            <div class="circulo">

                🐶

            </div>

            <h2>
                Todo por el bienestar
                de tu mascota
            </h2>

            <p>
                En VetSalud cuidamos a quienes
                hacen parte de nuestra familia.
            </p>

            <div class="huellas">
                🐾 🐾 🐾
            </div>

        </div>

    </div>

</body>

</html>
