<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>

    <link rel="stylesheet" href="css/contraseña.css">
</head>

<body>

    <div class="contenedor-recuperar">

        <h2>¿Olvidaste tu contraseña?</h2>

        <p>
            Ingresa tu correo electrónico registrado y te enviaremos
            las instrucciones para restablecer tu cuenta.
        </p>

        <form id="formRecuperar">

            <label for="correo">Correo electrónico</label>

            <input 
                type="email" 
                id="correo" 
                placeholder="ejemplo@correo.com" 
                required
            >

            <button type="submit">
                Enviar enlace de recuperación
            </button>

        </form>

        <div class="enlaces-retorno">
            <a href="login.html">Volver al Inicio de Sesión</a>
        </div>

    </div>

    <script>
        document.getElementById('formRecuperar').addEventListener('submit', function(event) {
            event.preventDefault();

            const correo = document.getElementById('correo').value;

            alert(`Se ha enviado un enlace de recuperación al correo: ${correo}`);

            window.location.href = "login.html";
        });
    </script>

</body>
</html>
